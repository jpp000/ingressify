# Desenvolvimento com hot reload — use: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend.dev
    ports: !override
      - "3000:3000"
    volumes:
      - ./apresentacao-frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

  backend:
    develop:
      watch:
        - action: rebuild
          path: ./apresentacao-backend
        - action: rebuild
          path: ./aplicacao
        - action: rebuild
          path: ./infraestrutura
        - action: rebuild
          path: ./dominio-marketplace
        - action: rebuild
          path: ./dominio-financeiro
        - action: rebuild
          path: ./dominio-identidade
        - action: rebuild
          path: ./dominio-compartilhado
        - action: rebuild
          path: ./pom.xml

volumes:
  frontend_node_modules:
