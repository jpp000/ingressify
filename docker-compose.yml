services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ingressify
      POSTGRES_USER: ingressify
      POSTGRES_PASSWORD: ingressify
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5433:5432"
    volumes:
      - ingressify_pg_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingressify -d ingressify"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: desenvolvimento,seed
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ingressify
      SPRING_DATASOURCE_USERNAME: ingressify
      SPRING_DATASOURCE_PASSWORD: ingressify
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      APP_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    restart: always

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: always

volumes:
  ingressify_pg_data:
